<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · ALERT DATA</title><link rel="stylesheet" href="/css/styles.css"></head><body class="auth-page"><main class="auth-layout"><a href="/" class="brand auth-brand"><span class="brand-mark"><i></i><i></i><i></i></span><span>ALERT <b>DATA</b></span></a><section class="auth-card wide"><span class="eyebrow">START SIMPLE</span><h1>Create your account.</h1><p class="muted">One account for data, bills, airtime and more.</p><div id="form-alert" class="alert hidden"></div><form id="register-form" class="stack-form"><label>Your name<input name="name" autocomplete="name" placeholder="e.g. Ada Okafor" required></label><label>Email address<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><div class="form-grid"><label>Password<input name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required></label><label>Wallet PIN<input name="pin" inputmode="numeric" maxlength="6" pattern="[0-9]{4,6}" placeholder="4–6 digits" required><small>This PIN confirms purchases.</small></label></div><button class="button full" type="submit">Create account <span>→</span></button></form><p class="auth-bottom">Already have an account? <a href="/pages/login.html">Log in</a></p></section></main><script src="/js/api.js"></script><script src="/js/auth.js"></script></body></html>
